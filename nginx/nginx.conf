user nginx;
worker_processes auto;
pcre_jit on;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
include /etc/nginx/modules/*.conf;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	# To support keepalive
	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}

	server_tokens off;
	client_max_body_size 1m;
	sendfile on;
	tcp_nopush on;
	gzip_vary on;

	# Taking advice from https://hynek.me/articles/hardening-your-web-servers-ssl-ciphers/#nginx
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
	ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256;
	ssl_prefer_server_ciphers off;

	ssl_session_cache shared:SSL:2m;
	ssl_session_timeout 1h;
	ssl_session_tickets off;

	# Fuck you Semrush
	deny 85.208.96.0/24;
	deny 185.191.171.0/24;

	# Fuck you OpenAI
	deny 20.171.206.0/24;

	# Fuck you Google
	deny 66.249.69.0/24;
	deny 66.249.75.0/24;

	# Fuck you Ahref
	deny 51.222.253.0/24;

	# Fuck you Bytedance
	deny 47.128.32.0/24;
	deny 47.128.37.0/24;
	deny 47.128.48.0/24;

	log_format main '$remote_addr - $remote_user [$time_local] "$request" '
		'$status $body_bytes_sent "$http_referer" '
		'"$http_user_agent" "$http_x_forwarded_for"';

	access_log /var/log/nginx/access.log main;

	include /etc/nginx/http.d/*.conf;
}

