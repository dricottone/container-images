proxy_set_header Host $host;                                  #address requested by client
proxy_set_header X-Forwarded-Proto https;                     #protocol client used to connect to first proxy
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  #forwarding hops

# enables keepalive
# NOTE: `$connection_upgrade` is not a built-in feature; see `nginx.conf`
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
